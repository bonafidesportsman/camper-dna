name: Affiliate link health check

on:
  push:
    paths:
      - "assets/data/products.json"
      - "tools/check_links.py"
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check affiliate link destinations
        run: python3 tools/check_links.py --json link-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
