<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Ideal VW Camper</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
</head>
<body>

    <header>
      <!-- insert header here -->
        <h1>CamperDNA</h1>
    </header>
    
    <main>
        <section class="hero" style="background-image: url('assets/images/t6-family.jpg'); background-size: cover; background-position: center; position: relative;">
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(31, 41, 55, 0.7);"></div>
            <div style="position: relative; padding: 50px; text-align: center; color: var(--color-white);">
                <h1 style="font-family: var(--font-heading); font-size: var(--fs-h1); line-height: var(--lh-tight);">Find Your Ideal VW Camper</h1>
                <a href="#" class="btn-primary" style="display: inline-block; padding: 12px 30px; background: var(--color-rust); color: var(--color-white); font-family: var(--font-body); font-size: var(--fs-body); font-weight: 600; text-decoration: none; border-radius: 4px; border: none; cursor: pointer;">Start the Quiz →</a>
            </div>
        </section>

        <section class="question-card" style="text-align: center; padding: 20px;">
            <div style="width: 80%; margin: 0 auto;">
                <div class="progress-bar" style="width: 100%; height: 6px; background-color: rgba(0, 0, 0, 0.06); border-radius: 3px; margin-bottom: 20px;">
                    <div style="width: 20%; height: 6px; background-color: var(--color-rust); border-radius: 3px;"></div>
                </div>
                <h2 style="font-family: var(--font-heading); font-size: var(--fs-h2); color: var(--color-slate);">Question 1: What's your budget?</h2>
                <div class="answer-options">
                    <button style="width: 100%; padding: 14px 20px; font-family: var(--font-body); font-size: var(--fs-body); color: var(--color-slate); border: 1px solid rgba(55, 65, 81, 0.4); border-radius: 4px; text-align: left; cursor: pointer; display: block; margin-bottom: 10px;">Under £20K</button>
                    <button style="width: 100%; padding: 14px 20px; font-family: var(--font-body); font-size: var(--fs-body); color: var(--color-slate); border: 1px solid rgba(55, 65, 81, 0.4); border-radius: 4px; text-align: left; cursor: pointer; display: block; margin-bottom: 10px;">£20–30K</button>
                    <button style="width: 100%; padding: 14px 20px; font-family: var(--font-body); font-size: var(--fs-body); color: var(--color-slate); border: 1px solid rgba(55, 65, 81, 0.4); border-radius: 4px; text-align: left; cursor: pointer; display: block; margin-bottom: 10px;">£30–45K</button>
                    <button style="width: 100%; padding: 14px 20px; font-family: var(--font-body); font-size: var(--fs-body); color: var(--color-slate); border: 1px solid rgba(55, 65, 81, 0.4); border-radius: 4px; text-align: left; cursor: pointer; display: block; margin-bottom: 10px;">£45K+</button>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                    <a href="#" style="color: var(--color-rust); text-decoration: none;">Back</a>
                    <a href="#" style="color: var(--color-rust); text-decoration: none;">Next</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
      <!--footer-->
    </footer>
</body>
</html>
